site_name: omniroadmap
site_description: Tool-agnostic roadmap/PM data with pluggable providers, a Dolt-backed canonical store, and prism-roadmap export
site_url: https://grokify.github.io/omniroadmap/
repo_url: https://github.com/grokify/omniroadmap
repo_name: grokify/omniroadmap
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Providers: providers.md
  - Fieldmap (MoSCoW/Kano/RICE): fieldmap.md
  - Augments: augment.md
  - Store & Sync: store-sync.md
  - prism-roadmap Export: export-prismroadmap.md
  - CLI Reference: cli.md
